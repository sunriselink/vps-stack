- name: Initial server configuration
  hosts: all

  remote_user: root
  port: 22
  become: false

  roles:
    - packages
    - user
    - ssh

- name: Configure firewall
  hosts: all
  become: true

  vars:
    ansible_user: '{{ user }}'
    ansible_port: '{{ ssh_port }}'
    ansible_ssh_private_key_file: '{{ user_ssh_private_key_path }}'

  roles:
    - firewall
