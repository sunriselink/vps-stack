- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow SSH port
  community.general.ufw:
    rule: allow
    port: '{{ ssh_port }}'
    proto: tcp

- name: Set default incoming policy
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set default outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Enable UFW
  community.general.ufw:
    state: enabled
