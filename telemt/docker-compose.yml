services:
  telemt:
    image: ghcr.io/telemt/telemt:3.3.39
    container_name: telemt
    restart: unless-stopped
    read_only: true
    working_dir: /run/telemt
    environment:
      RUST_LOG: info
    ports:
      - ${PUBLIC_PORT:?}:443
      - 127.0.0.1:${METRICS_PORT:?}:9090
      - 127.0.0.1:${API_PORT:?}:9091
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config.toml:/run/telemt/config.toml:ro
      - ./config.user.toml:/run/telemt/config.user.toml:ro
    tmpfs:
      - /run/telemt:rw,mode=1777,size=1m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  telemt-panel:
    image: ghcr.io/amirotin/telemt_panel:0.5.2
    container_name: telemt-panel
    restart: unless-stopped
    user: nobody:nogroup
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - 127.0.0.1:${PANEL_PORT:?}:8080
    volumes:
      - ./config.panel.toml:/etc/telemt-panel/config.toml:ro
    depends_on:
      - telemt

networks:
  default:
    name: telemt
    driver_opts:
      com.docker.network.bridge.name: br-telemt
