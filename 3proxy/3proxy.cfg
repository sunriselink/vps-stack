timeouts 1 5 30 60 180 1800 15 60

users $/etc/3proxy/.3proxypasswd

log /var/logs/3proxy/3proxy.log D
logformat "-\""+_G{""time_unix"":%t,""error"":{""code"":""%E""},""auth"":{""user"":""%U""},""client"":{""ip"":""%C""},""server"":{""ip"":""%R"",""port"":%r},""bytes"":{""sent"":%O,""received"":%I},""request"":{""hostname"":""%n""},""message"":""%T""}"
rotate 100

maxconn 500
auth strong
socks -p5000
